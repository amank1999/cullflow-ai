[package]
name = "cullflow-core"
version = "0.1.0"
edition = "2021"
description = "CullFlow AI core engine: ingestion, proxy scanning, CV scoring heuristics, and NLE XML export. No GUI/Tauri dependency so it builds and tests headlessly."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
imageproc = "0.25"
rayon = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
which = "7"
ed25519-dalek = { version = "2", features = ["rand_core", "pkcs8", "pem"] }
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
machine-uid = "0.6"
ort = { version = "2.0.0-rc.13", optional = true, features = ["download-binaries"] }

[dev-dependencies]
tempfile = "3"

[features]
# Off by default so `cargo test -p cullflow-core` stays fully offline/local -
# ort-sys's build script downloads a prebuilt ONNX Runtime binary, which
# doesn't work in network-restricted environments (see README's "Known
# simplifications"). Real desktop builds (src-tauri) enable both of these.
face-detection = ["dep:ort"]
# Same reasoning as face-detection - gates the Silero VAD ONNX model instead.
# A separate feature (rather than folding into face-detection) because it's
# a distinct model/capability, even though both need the same `ort` runtime.
audio-vad = ["dep:ort"]
