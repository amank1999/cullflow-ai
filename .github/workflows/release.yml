name: Release

# Builds CullFlow AI desktop installers for macOS (Apple Silicon), Windows,
# and Linux, and publishes them as downloadable files on a GitHub Release.
# Trigger by pushing a tag like `v0.1.0`, or manually from the Actions tab.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish under (e.g. v0.1.0). Only used for manual runs - a tag push uses the pushed tag automatically."
        required: false
        default: "manual-test-build"

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

permissions:
  contents: write # tauri-action needs this to create/update the GitHub Release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Intel Mac (macos-13) is intentionally not built here: GitHub's
          # Intel-Mac runner pool was slow enough in practice (35+ min
          # queued, never started) to not be worth blocking releases on -
          # Apple Silicon covers all Macs since 2020. Add it back to this
          # matrix if Intel Mac support is needed later.
          - platform: macos-latest # Apple Silicon runner
            ffmpeg_triple: aarch64-apple-darwin
          - platform: ubuntu-22.04
            ffmpeg_triple: x86_64-unknown-linux-gnu
          - platform: windows-latest
            ffmpeg_triple: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libayatana-appindicator3-dev libxdo-dev

      - name: Fetch bundled ffmpeg (macOS)
        if: startsWith(matrix.platform, 'macos')
        run: |
          mkdir -p src-tauri/binaries
          curl -fL "https://evermeet.cx/ffmpeg/getrelease/zip" -o /tmp/ffmpeg.zip
          unzip -oq /tmp/ffmpeg.zip -d /tmp
          cp /tmp/ffmpeg "src-tauri/binaries/ffmpeg-${{ matrix.ffmpeg_triple }}"
          chmod +x "src-tauri/binaries/ffmpeg-${{ matrix.ffmpeg_triple }}"

      - name: Fetch bundled ffmpeg (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          mkdir -p src-tauri/binaries
          curl -fL "https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz" -o /tmp/ffmpeg.tar.xz
          tar -xf /tmp/ffmpeg.tar.xz -C /tmp
          cp /tmp/ffmpeg-*-amd64-static/ffmpeg "src-tauri/binaries/ffmpeg-${{ matrix.ffmpeg_triple }}"
          chmod +x "src-tauri/binaries/ffmpeg-${{ matrix.ffmpeg_triple }}"

      - name: Fetch bundled ffmpeg (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg-extract
          $ffmpegExe = Get-ChildItem -Path ffmpeg-extract -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          Copy-Item $ffmpegExe.FullName "src-tauri/binaries/ffmpeg-${{ matrix.ffmpeg_triple }}.exe"

      - name: Install frontend dependencies
        run: npm install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: "CullFlow AI ${{ env.RELEASE_TAG }}"
          releaseBody: "See README.md for what's implemented in this build."
          releaseDraft: true
          prerelease: false
