name: CI

# Fast feedback on every push: runs the headless test suite and a real debug
# build of the desktop app (with the face-detection feature enabled, which
# needs to download an ONNX Runtime binary - something the sandboxed dev
# environment this project was originally built in could not do, so this is
# the only place that path gets verified end to end).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libayatana-appindicator3-dev libxdo-dev

      - name: Test headless crates (no native webview / ONNX runtime needed)
        run: cargo test -p cullflow-core -p cullflow-keygen

      - name: Placeholder ffmpeg sidecar (build-time resource check only, not run)
        run: |
          mkdir -p src-tauri/binaries
          printf '#!/bin/sh\nexit 1\n' > src-tauri/binaries/ffmpeg-x86_64-unknown-linux-gnu
          chmod +x src-tauri/binaries/ffmpeg-x86_64-unknown-linux-gnu

      - name: Build desktop app (real build, face-detection feature enabled)
        run: cargo build -p cullflow-ai

      - name: Install frontend dependencies
        run: npm install

      - name: Typecheck + build frontend
        run: npm run build
